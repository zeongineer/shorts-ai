[server]
maxUploadSize = 1024

[theme]
base = "light"
primaryColor = "#1C9DE9"
backgroundColor = "#F4F6F8"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#10161D"
font = "sans serif"

# 참고: [theme] 섹션을 명시적으로 지정하면 Streamlit 우측 상단 메뉴에서
# 사용자가 "Settings > Theme"으로 다크 모드 등 다른 테마로 전환하는 옵션 자체가
# 비활성화됩니다. app.py의 색상 대비 값들이 이 고정된 라이트 테마를 전제로
# 계산되었으므로, 이 파일을 함께 배포해야 대비 붕괴를 완전히 방지할 수 있습니다.
